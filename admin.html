<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração | Grupo Recreativo Mirandense</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="admin.css">
</head>

<body class="bg-casa min-h-screen flex flex-col">

  <!-- Cabeçalho Amarelo IDÊNTICO ao site principal -->
  <div class="faixa">
    <header class="max-w-6xl mx-auto px-4 pt-2 flex items-center justify-between gap-4">
      <p class="flex items-baseline gap-3">
        <span class="display text-3xl leading-none">GRM</span>
        <span class="text-sm font-medium">Gestão Administrativa</span>
      </p>
      <a href="https://ccarvalho15.github.io/grm-rifas-solidarias/" target="_blank" rel="noopener noreferrer"
        class="flex items-center">
        <img src="images/logotipo.png" alt="Regressar ao site" class="h-20 w-20 object-contain hover:opacity-85 transition">
      </a>
    </header>
  </div>

  <!-- Conteúdo Principal -->
  <main class="max-w-6xl mx-auto w-full px-4 py-8 flex-grow">

    <!-- Título da página fora da faixa amarela -->
    <h1 class="display text-3xl sm:text-4xl mb-8">Administração</h1>

        <!-- Área de Login -->
    <form id="loginArea" onsubmit="autenticar(event)" class="max-w-md bg-white p-6 rounded-md shadow-sm space-y-4">
      <div>
        <label for="passInput" class="block text-sm font-semibold mb-1">Palavra-passe</label>
        <div class="flex gap-2">
          <input type="password" id="passInput" class="field flex-grow px-3 py-2 border rounded-md"
            autocomplete="current-password" required>
          <button type="submit"
            class="btn btn-primario bg-stone-900 text-white px-4 py-2 rounded-md font-semibold hover:bg-stone-800 transition">Entrar</button>
        </div>
      </div>
      <p id="loginErro" class="erro text-red-600 text-sm" role="alert" hidden>Palavra-passe incorreta.</p>
    </form>


    <div id="contentArea" hidden>

      <!-- Layout Lado a Lado (Grelha 12 Colunas) -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

        <!-- Coluna da Esquerda: Filtros e Tabela de Números (7 colunas) -->
        <div class="lg:col-span-7 space-y-4">
          <div class="barra">
            <div class="filtros" role="group" aria-label="Filtrar por estado">
              <button type="button" class="filtro" data-filtro="todos" aria-pressed="true">Todos</button>
              <button type="button" class="filtro" data-filtro="pendente" aria-pressed="false">Pendentes</button>
              <button type="button" class="filtro" data-filtro="pago" aria-pressed="false">Pagos</button>
            </div>
            <button type="button" id="btnAtualizar" class="btn btn-secundario">Atualizar</button>
          </div>

          <p id="aviso" class="aviso" role="status" aria-live="polite"></p>

          <div id="tabelaContainer">
            <p class="vazio">A carregar os dados…</p>
          </div>
        </div>

        <!-- Coluna da Direita: Progresso da Angariação (5 colunas) -->
        <div class="lg:col-span-5 sticky top-6">
          <section class="progresso" aria-labelledby="progTitulo">
            <h2 id="progTitulo" class="display">Progresso da Angariação</h2>

            <p class="prog-valor">
              <span id="metricRaised" class="display">0 €</span>
              <span id="metricPercent">0% da meta de 500 €</span>
            </p>

            <div class="prog-barra" role="progressbar" aria-label="Números pagos" aria-valuemin="0" aria-valuemax="250"
              aria-valuenow="0">
              <div id="progressBar" style="width: 0%"></div>
            </div>
            <p class="prog-linha">
              <span>Números confirmados</span>
              <strong id="metricNumbers">0 / 250</strong>
            </p>

            <dl class="resumo grid grid-cols-3 gap-3 pt-4 border-t border-stone-100 text-center">
              <div class="bg-emerald-50/70 p-3 rounded-lg border border-emerald-100">
                <dt class="text-xs text-emerald-800 font-semibold mb-1">Pagos</dt>
                <dd id="statPaid" class="text-xl font-bold text-emerald-700">0</dd>
              </div>
              <div class="bg-amber-50/70 p-3 rounded-lg border border-amber-100">
                <dt class="text-xs text-amber-800 font-semibold mb-1">Pendentes</dt>
                <dd id="statReserved" class="text-xl font-bold text-amber-700">0</dd>
              </div>
              <div class="bg-stone-50 p-3 rounded-lg border border-stone-200/80">
                <dt class="text-xs text-stone-600 font-semibold mb-1">Livres</dt>
                <dd id="statAvailable" class="text-xl font-bold text-stone-800">250</dd>
              </div>
            </dl>
          </section>
        </div>

      </div> <!-- Fim da Grelha -->

    </div> <!-- Fim do contentArea -->
  </main>

  <script src="admin.js"></script>
</body>

</html>
